server:
  port: 8081
  # Location (201) construite avec l'URL publique (X-Forwarded-* posés par Kong) et non backend:8081.
  # Sûr ici : seul Kong peut joindre le backend.
  forward-headers-strategy: framework

spring:
  application:
    name: petites-annonces-backend
  datasource:
    # Valeurs fournies par docker-compose (depuis .env) ; défauts pour un lancement local
    url: ${DB_URL:jdbc:postgresql://localhost:5432/annonces}
    username: ${DB_USER:annonces}
    password: ${DB_PASSWORD:}
  jpa:
    # Le schéma appartient à Flyway : Hibernate vérifie, ne modifie jamais
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mvc:
    # Erreurs Spring MVC (400, 404, 405...) au format ProblemDetail (RFC 9457)
    problemdetails:
      enabled: true

logging:
  pattern:
    # Bonus : identifiant de corrélation de Kong (MDC rempli par CorrelationIdFilter) sur chaque ligne
    correlation: "[cid=%X{correlationId:-}] "
  level:
    # Trace des headers reçus de la gateway (GW-01, GW-08)
    com.petitesannonces.security.HeaderAuthenticationFilter: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
