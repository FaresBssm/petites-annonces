# Intégration et déploiement continus PetitesAnnonces
#   - push / pull request : tests d'intégration du backend (Testcontainers PostgreSQL 16)
#   - push sur main, tests verts : images construites et publiées sur Docker Hub (tags "latest" et SHA du commit)
#   - push sur main, images publiées : déploiement SSH sur la VM
#     (HTTPS public via le reverse proxy Nginx partagé, cf. deploy/)
#
# Secrets du dépôt : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VM_HOST, VM_USER, VM_SSH_KEY, VM_SSH_KNOWN_HOSTS, PROD_ENV_FILE
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un nouveau push annule la CI encore en cours sur la même branche (le déploiement, lui, n'est jamais interrompu)
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_PATH: /opt/petites-annonces

jobs:

  tests:
    name: Tests backend (Java 21, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvnw verify (tests d'intégration)
        run: ./mvnw -B -ntp verify

      - name: Rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  images:
    name: Image ${{ matrix.composant }} -> Docker Hub
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        composant: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/petites-annonces-${{ matrix.composant }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.composant }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache des couches entre deux exécutions (dépendances Maven / npm)
          cache-from: type=gha,scope=${{ matrix.composant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.composant }}

  deploy:
    name: Déploiement sur la VM (SSH)
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Clé SSH dédiée et empreinte vérifiée de la VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $VM_HOST
            User $VM_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      # .env de production = secret PROD_ENV_FILE, avec l'image exacte de ce commit (et non "latest")
      - name: Configuration de production
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          umask 077
          printf '%s\n' "$PROD_ENV_FILE" | sed "s/^IMAGE_TAG=.*/IMAGE_TAG=${GITHUB_SHA}/" > env.prod
          # Toute modification de la config Kong change ce label -> conteneur gateway recréé au déploiement
          echo "KONG_CONFIG_HASH=$(find kong -type f | sort | xargs cat | sha256sum | cut -c1-16)" >> env.prod
          for v in PUBLIC_APP_URL PUBLIC_API_URL PUBLIC_AUTH_URL; do
            grep -q "^$v=" env.prod || { echo "::error::$v absent de PROD_ENV_FILE"; exit 1; }
          done
          # URL publiques (non secrètes) pour le test de fumée
          grep -E '^PUBLIC_(APP|API|AUTH)_URL=' env.prod >> "$GITHUB_ENV"

      - name: Copie des fichiers de déploiement
        run: |
          tar czf - deploy/docker-compose.prod.yml deploy/reverse-proxy postgres/init.sql \
                    keycloak/realm-annonces.json kong/kong.yml kong/render-config.sh kong/plugins \
            | ssh vm "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"
          ssh vm "umask 077 && cat > '$DEPLOY_PATH/deploy/.env.prod'" < env.prod
          rm -f env.prod

      - name: Mise à jour de la stack (images publiques, aucune connexion au registre)
        run: |
          ssh vm "cd '$DEPLOY_PATH' \
            && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod pull --quiet \
            && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --wait --wait-timeout 300 --remove-orphans \
            && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod ps"

      - name: Test de fumée HTTPS
        run: |
          set -e
          curl -fsS -o /dev/null "$PUBLIC_APP_URL/" && echo "application : OK"
          test "$(curl -fsS "$PUBLIC_AUTH_URL/realms/annonces/.well-known/openid-configuration" | jq -r .issuer)" \
               = "$PUBLIC_AUTH_URL/realms/annonces" && echo "keycloak : issuer OK"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_API_URL/api/me")
          test "$code" = "401" && echo "gateway : 401 sans token, OK"

      - name: Nettoyage
        if: always()
        run: rm -rf ~/.ssh env.prod
