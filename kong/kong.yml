# Configuration déclarative de Kong OSS en mode DB-less (KONG_DATABASE=off).
# Tout l'état de la gateway tient dans ce fichier versionné (GW-11) : pas de base, pas d'Admin API exposée.
# Uniquement des plugins de l'édition open source (le plugin openid-connect, Enterprise, est interdit).
_format_version: "3.0"
_transform: true

services:
  - name: annonces-backend
    url: http://backend:8081
    routes:
      - name: api
        paths:
          - /api
        # Le backend expose lui-même ses endpoints sous /api : le chemin est transmis tel quel
        strip_path: false
        # Le backend reçoit Host: backend:8081 ; l'URL publique lui parvient via X-Forwarded-*
        preserve_host: false
        plugins:
          # Bonus traçabilité (priorité la plus haute de Kong) : un identifiant par requête, transmis au backend
          # (repris dans ses logs) et renvoyé au client, y compris sur les 401 / 429 générés par Kong.
          - name: correlation-id
            config:
              header_name: X-Correlation-ID
              generator: uuid#counter
              echo_downstream: true

          # CORS (priorité 2000, avant tout le reste) : seule la SPA peut lire les réponses de l'API.
          # Les preflight OPTIONS sont traités et terminés ici : ni authentifiés, ni décomptés (RL-05).
          - name: cors
            config:
              # Regex ancrée et non texte simple : avec UNE origine en texte simple, Kong renvoie cette
              # origine à tout le monde sans comparer ; une regex est comparée à l'Origin reçue, et
              # aucun Access-Control-Allow-Origin n'est renvoyé à une autre origine (GW-09).
              origins:
                - ^http://localhost:4200$
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
              headers:
                - Authorization
                - Content-Type
              # Lisibles par le JavaScript du front : délai d'un 429 (FR-05), URL d'une ressource créée
              exposed_headers:
                - Retry-After
                - Location
                - X-Correlation-ID
              credentials: false
              max_age: 600
              preflight_continue: false

          # Validation du token (GW-01 à GW-04) : le plugin jwt de Kong OSS ne lit pas le JWKS,
          # la clé publique du realm est figée dans le credential du consumer ci-dessous.
          - name: jwt
            config:
              # Le claim iss désigne le credential à utiliser : un autre émetteur -> aucun credential -> 401
              key_claim_name: iss
              claims_to_verify:
                - exp
              # Token accepté uniquement dans l'en-tête Authorization (ni ?jwt= dans l'URL, ni cookie)
              header_names:
                - authorization
              uri_param_names: []
              cookie_names: []
              # Les preflight OPTIONS ne portent jamais de token (traités par le plugin cors)
              run_on_preflight: false

          # Plugin maison (kong/plugins/identity-headers, priorité 1000) : supprime les headers
          # d'identité forgés, pose X_USER_ID (sub) et X_ROLE_ID (rôles du realm), retire Authorization.
          - name: identity-headers
            config:
              roles_autorises:
                - USER
                - MODERATEUR
                - ADMIN
              # Bonus : seul un token émis pour la SPA est accepté (claim azp)
              client_attendu: annonces-front
              # Bonus : secret partagé posé dans X-Gateway-Secret. Référence de vault : la valeur réelle est
              # lue dans la variable d'environnement GATEWAY_SECRET du conteneur (.env), jamais écrite ici.
              secret_backend: "{vault://env/gateway-secret}"

          # 3 appels / minute PAR UTILISATEUR (compteur indexé sur X_USER_ID posé par identity-headers),
          # sur tous les endpoints /api/**. Au-delà : 429 + Retry-After, le backend n'est pas appelé.
          - name: rate-limiting
            config:
              minute: 22
              policy: local
              limit_by: header
              header_name: X_USER_ID
              # Si le compteur est indisponible, on refuse plutôt que de laisser passer
              fault_tolerant: false

consumers:
  - username: keycloak-annonces
    jwt_secrets:
      # key = valeur EXACTE du claim iss des tokens du realm (KC_HOSTNAME=http://localhost:8180)
      - key: http://localhost:8180/realms/annonces
        algorithm: RS256
        # Clé publique de la paire RSA fixe du realm (keycloak/realm-public-key.pem)
        rsa_public_key: |
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAl9D6OJT2gsAAIlRV1ia4
          SH4jzsG9SrJhwjsqriheqvWKD0tXfZHOx+bMzsifry7IVtPFphgM8fBP40JQVbOP
          XJcxjj9k1hdd14HFySBtI2RH4SLovD5tH8QdEfKCgQYm1JMrL2tsOSjCtBzLvpST
          /k7PCXaVEwVd4/JkLU4KUS3vt9ouNPZJ0Kr0pWyS9HPyMV2FUP3Hr99T2nRZI/86
          On5YmCwQavdL0SsTKw+8WC0zQZBmGSDvGtSkU4hgwXWzvoHb7/G0PCVIlLEIYip5
          zr+A1ltD7pw15cBvYa7XXsT8pCfsgvbktW9yfK2GwI3WKSu0snX4Yf9HmaSgpGtO
          fwIDAQAB
          -----END PUBLIC KEY-----
