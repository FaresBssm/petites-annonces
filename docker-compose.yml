name: petites-annonces

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Lus par postgres/init.sql (\getenv) pour créer les deux bases
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      ANNONCES_DB_USER: ${ANNONCES_DB_USER}
      ANNONCES_DB_PASSWORD: ${ANNONCES_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Aucun port publié : la base n'est joignable que depuis le réseau internal (DEP-02)
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # URL publique vue par le navigateur : fixe le claim iss des tokens à
      # http://localhost:8180/realms/annonces, quelle que soit l'URL d'appel.
      KC_HOSTNAME: http://localhost:8180
      # Endpoints /health sur le port de management 9000 (non publié)
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    networks:
      - public
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Ni curl ni wget dans l'image : requête HTTP brute via /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

networks:
  # Côté navigateur : frontend, gateway, keycloak
  public:
  # Côté serveur : gateway, backend, postgres, keycloak. internal: true coupe l'accès
  # vers l'extérieur, et un port publié d'un service uniquement sur ce réseau est inopérant.
  internal:
    internal: true

volumes:
  pgdata:
