name: petites-annonces

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Lus par postgres/init.sql (\getenv) pour créer les deux bases
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      ANNONCES_DB_USER: ${ANNONCES_DB_USER}
      ANNONCES_DB_PASSWORD: ${ANNONCES_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Aucun port publié : la base n'est joignable que depuis le réseau internal (DEP-02)
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # --import-realm : importe /opt/keycloak/data/import/*.json au démarrage,
    # uniquement si le realm n'existe pas encore en base.
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-annonces.json:/opt/keycloak/data/import/realm-annonces.json:ro
    environment:
      # Mots de passe des utilisateurs de test, substitués dans le realm à l'import
      REALM_ALICE_PASSWORD: ${REALM_ALICE_PASSWORD}
      REALM_BOB_PASSWORD: ${REALM_BOB_PASSWORD}
      REALM_MODO_PASSWORD: ${REALM_MODO_PASSWORD}
      REALM_ADMIN_PASSWORD: ${REALM_ADMIN_PASSWORD}
      # Clé privée RSA fixe du realm : la clé publique est figée dans kong.yml
      REALM_RSA_PRIVATE_KEY: ${REALM_RSA_PRIVATE_KEY}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # URL publique vue par le navigateur : fixe le claim iss des tokens à
      # http://localhost:8180/realms/annonces, quelle que soit l'URL d'appel.
      KC_HOSTNAME: http://localhost:8180
      # Endpoints /health sur le port de management 9000 (non publié)
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    networks:
      - public
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Ni curl ni wget dans l'image : requête HTTP brute via /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/annonces
      DB_USER: ${ANNONCES_DB_USER}
      DB_PASSWORD: ${ANNONCES_DB_PASSWORD}
    # Aucun port publié : seule la gateway (réseau internal) peut l'appeler (DEP-02)
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  gateway:
    # Image officielle, édition open source, sans build (GW-11)
    image: kong:3.9.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Admin API limitée à l'intérieur du conteneur et jamais publiée sur l'hôte (GW-10)
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      # Seul le proxy est publié : localhost:8080 -> 8000
      - "8080:8000"
    networks:
      - public
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

networks:
  # Côté navigateur : frontend, gateway, keycloak
  public:
  # Côté serveur : gateway, backend, postgres, keycloak. internal: true coupe l'accès
  # vers l'extérieur, et un port publié d'un service uniquement sur ce réseau est inopérant.
  internal:
    internal: true

volumes:
  pgdata:
