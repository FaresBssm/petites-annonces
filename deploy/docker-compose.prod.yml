# Déploiement sur la VM (serveur partagé) : images Docker Hub, aucun build.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --wait
#
# Le TLS est terminé par le reverse proxy Nginx commun de la VM (réseau Docker externe "proxy") :
#   https://app.<ip>.sslip.io  -> pa-frontend:80
#   https://api.<ip>.sslip.io  -> pa-gateway:8000   (Kong)
#   https://auth.<ip>.sslip.io -> pa-keycloak:8080
# Aucun port n'est publié sur l'hôte. Le backend et PostgreSQL restent sur le réseau "internal".
# Noms de conteneurs préfixés "pa-" : uniques sur une VM qui héberge d'autres projets.
name: petites-annonces

services:

  postgres:
    image: postgres:16-alpine
    container_name: pa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      ANNONCES_DB_USER: ${ANNONCES_DB_USER}
      ANNONCES_DB_PASSWORD: ${ANNONCES_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: pa-keycloak
    # Mode production : TLS terminé par le reverse proxy, en-têtes X-Forwarded-* pris en compte
    command: start --import-realm
    volumes:
      - ../keycloak/realm-annonces.json:/opt/keycloak/data/import/realm-annonces.json:ro
    environment:
      REALM_ALICE_PASSWORD: ${REALM_ALICE_PASSWORD}
      REALM_BOB_PASSWORD: ${REALM_BOB_PASSWORD}
      REALM_MODO_PASSWORD: ${REALM_MODO_PASSWORD}
      REALM_ADMIN_PASSWORD: ${REALM_ADMIN_PASSWORD}
      REALM_RSA_PRIVATE_KEY: ${REALM_RSA_PRIVATE_KEY}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pa-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_AUTH_URL}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    networks:
      - internal
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_NAMESPACE}/petites-annonces-backend:${IMAGE_TAG}
    container_name: pa-backend
    environment:
      DB_URL: jdbc:postgresql://pa-postgres:5432/annonces
      DB_USER: ${ANNONCES_DB_USER}
      DB_PASSWORD: ${ANNONCES_DB_PASSWORD}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  gateway:
    image: kong:3.9.4
    container_name: pa-gateway
    # Empreinte de kong.yml / render-config.sh / plugin (calculée par la CI) : la config est montée en volume,
    # donc sans ce label "up -d" ne recréerait pas Kong et il garderait l'ancienne configuration.
    labels:
      com.petitesannonces.kong-config: ${KONG_CONFIG_HASH:-inconnu}
    # Génère la configuration de production à partir de kong/kong.yml, puis lance Kong
    entrypoint: ["/bin/sh", "/kong/render-config.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_PLUGINS: bundled,identity-headers
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_DNS_NOT_FOUND_TTL: "1"
      # Kong n'est joignable que par le reverse proxy : on garde ses X-Forwarded-* (https, host, port 443)
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
      KONG_REAL_IP_HEADER: X-Forwarded-For
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # Lues par render-config.sh
      PUBLIC_AUTH_URL: ${PUBLIC_AUTH_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      REALM_PUBLIC_KEY: ${REALM_PUBLIC_KEY}
      BACKEND_URL: http://pa-backend:8081
    volumes:
      - ../kong/kong.yml:/kong/declarative/kong.yml:ro
      - ../kong/render-config.sh:/kong/render-config.sh:ro
      - ../kong/plugins/identity-headers:/usr/local/share/lua/5.1/kong/plugins/identity-headers:ro
    networks:
      - internal
      - proxy
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE}/petites-annonces-frontend:${IMAGE_TAG}
    container_name: pa-frontend
    environment:
      PUBLIC_AUTH_URL: ${PUBLIC_AUTH_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    networks:
      - proxy
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<app-root'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

networks:
  internal:
    internal: true
  # Réseau du reverse proxy commun de la VM (créé par l'autre projet, non géré ici)
  proxy:
    external: true
    name: proxy

volumes:
  pgdata:
