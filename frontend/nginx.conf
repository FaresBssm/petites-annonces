server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA : toute route inconnue (/annonces/42, /moderation...) renvoie index.html,
    # c'est le routeur Angular qui l'interprète.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais mis en cache (il référence les bundles versionnés)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Bundles JS/CSS : noms contenant un hash, cache long
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
