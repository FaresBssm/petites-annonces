<header class="entete">
  <a class="marque" routerLink="/annonces">PetitesAnnonces</a>

  <nav class="menu">
    <a routerLink="/annonces" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">Annonces</a>
    <a routerLink="/mes-annonces" routerLinkActive="actif">Mes annonces</a>
    <a routerLink="/profil" routerLinkActive="actif">Mon profil</a>
  </nav>

  @if (auth.connecte()) {
    <div class="utilisateur">
      <span class="nom">{{ auth.nomUtilisateur() }}</span>
      <span class="roles">{{ auth.roles().join(' · ') }}</span>
      <button type="button" class="bouton secondaire" (click)="auth.seDeconnecter()">Se déconnecter</button>
    </div>
  }
</header>

@if (notifications.notification(); as n) {
  <div class="notification {{ n.type }}" role="alert">
    <span>{{ n.message }}</span>
    <button type="button" aria-label="Fermer" (click)="notifications.fermer()">×</button>
  </div>
}

<main class="contenu">
  <router-outlet />
</main>
