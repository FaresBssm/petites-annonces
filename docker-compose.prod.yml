# Surcharge de production, utilisée par le déploiement continu (.github/workflows/ci-cd.yml) :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# - backend et frontend : images publiées sur GHCR par la CI, aucun build sur le serveur ;
# - ports publiés sur 127.0.0.1 uniquement : les URL de l'appli restent http://localhost:*
#   (iss des tokens, CORS, redirect URI), on y accède par tunnel SSH, et la console Keycloak
#   n'est pas exposée en HTTP sur Internet.
# Requiert Docker Compose >= 2.24.4 (!reset / !override).

services:

  keycloak:
    ports: !override
      - "127.0.0.1:8180:8080"

  backend:
    build: !reset null
    image: ${IMAGE_REGISTRY}/petites-annonces-backend:${IMAGE_TAG:-latest}

  gateway:
    ports: !override
      - "127.0.0.1:8080:8000"

  frontend:
    build: !reset null
    image: ${IMAGE_REGISTRY}/petites-annonces-frontend:${IMAGE_TAG:-latest}
    ports: !override
      - "127.0.0.1:4200:80"
